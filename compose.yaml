services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: wildman
      POSTGRES_USER: wildman
      POSTGRES_PASSWORD: ${WILDMAN_POSTGRES_PASSWORD:-wildman-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  wildman:
    build: .
    image: wildman-service:local
    container_name: wildman-service
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      WILDMAN_ENV: production
      WILDMAN_LOG_LEVEL: info
      WILDMAN_PROVIDER_CONTACT: ${WILDMAN_PROVIDER_CONTACT:-}
      WILDMAN_DATABASE_URL: postgres://wildman:${WILDMAN_POSTGRES_PASSWORD:-wildman-development-only}@postgres:5432/wildman?sslmode=disable
    depends_on:
      - postgres
    volumes:
      - ./data:/data
    restart: unless-stopped

  worker:
    image: wildman-service:local
    build: .
    entrypoint: ["/usr/local/bin/wildman-worker"]
    environment:
      WILDMAN_ENV: production
      WILDMAN_LOG_LEVEL: info
      WILDMAN_DATABASE_URL: postgres://wildman:${WILDMAN_POSTGRES_PASSWORD:-wildman-development-only}@postgres:5432/wildman?sslmode=disable
      WILDMAN_PROVIDER_CONTACT: ${WILDMAN_PROVIDER_CONTACT:-}
      WILDMAN_ACOUSTID_API_KEY: ${WILDMAN_ACOUSTID_API_KEY:-}
    depends_on:
      - postgres
      - wildman
    restart: unless-stopped

volumes:
  postgres-data:
